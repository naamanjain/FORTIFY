# FORTIFY frontend nginx configuration.
# Same-origin deployment: static SPA + reverse proxy to the backend, matching
# the Vite dev proxy (see frontend/vite.config.ts).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip the static assets (JS/CSS bundles).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page application routing — every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the FastAPI backend (service name "fortify-backend").
    location /api/ {
        proxy_pass http://fortify-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://fortify-backend:8000;
    }
}
