# FORTIFY frontend nginx configuration.
# Same-origin deployment: static SPA + reverse proxy to the backend, matching
# the Vite dev proxy (see frontend/vite.config.ts).
#
# nginx:alpine includes /etc/nginx/conf.d/*.conf inside the http{} block, so
# this file may declare http-context directives (the rate-limit zone below).

# Edge DoS protection: the API serves small JSON responses, but some endpoints
# trigger full-artifact parsing or whole-log verification, so a modest request
# cap per client address keeps one caller from starving the rest. This
# complements the application-level limiter (FORTIFY_RATE_LIMIT); it does not
# replace it, and neither is a substitute for a real gateway in production.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip the static assets (JS/CSS bundles).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page application routing — every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the FastAPI backend (service name "fortify-backend").
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        # API payloads are small; a large body is abuse, not a use case.
        client_max_body_size 64k;
        proxy_pass http://fortify-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Liveness and readiness pass through so orchestrators and dashboards can
    # probe the same origin the UI uses.
    location = /health {
        proxy_pass http://fortify-backend:8000;
    }

    location = /ready {
        proxy_pass http://fortify-backend:8000;
    }
}
