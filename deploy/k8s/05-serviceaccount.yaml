# Dedicated service account with no API access: the application never talks
# to the Kubernetes API, so it must not hold a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortify-backend
  namespace: fortify
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fortify-frontend
  namespace: fortify
automountServiceAccountToken: false
