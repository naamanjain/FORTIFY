apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortify-frontend
  namespace: fortify
  labels:
    app.kubernetes.io/name: fortify-frontend
    app.kubernetes.io/part-of: fortify
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fortify-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortify-frontend
        app.kubernetes.io/part-of: fortify
    spec:
      containers:
        - name: web
          image: fortify-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health # proxied to the backend by nginx
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fortify-frontend
  namespace: fortify
  labels:
    app.kubernetes.io/name: fortify-frontend
    app.kubernetes.io/part-of: fortify
spec:
  selector:
    app.kubernetes.io/name: fortify-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
