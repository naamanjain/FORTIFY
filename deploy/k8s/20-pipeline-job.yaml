# Regenerates the deterministic demo environment (seed 42, 500 personnel,
# 180 days) into the fortify-store volume. Created SUSPENDED so a plain
# `kubectl apply` does not trigger the run — unsuspend explicitly (see
# deploy/k8s/README.md). Re-run by deleting and re-applying this job.
apiVersion: batch/v1
kind: Job
metadata:
  name: fortify-pipeline
  namespace: fortify
  labels:
    app.kubernetes.io/part-of: fortify
spec:
  suspend: true
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fortify-pipeline
        app.kubernetes.io/part-of: fortify
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: pipeline
          image: fortify-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/build_all.py"]
          envFrom:
            - configMapRef:
                name: fortify-config
          volumeMounts:
            - name: store
              mountPath: /app/data/generated
              subPath: data/generated
            - name: store
              mountPath: /app/data/runtime
              subPath: data/runtime
            - name: store
              mountPath: /app/artifacts
              subPath: artifacts
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 4Gi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: fortify-store
