# FORTIFY prototype — local container orchestration.
#
#   docker compose up --build
#
# 1. "pipeline" regenerates the deterministic demo dataset + models
#    (seed 42, 500 personnel, 180 days — same output as scripts/build_all.py)
#    into named volumes, then exits.
# 2. "fortify-backend" starts the FastAPI API against those volumes.
# 3. "fortify-frontend" serves the built SPA on http://localhost:5173 and
#    proxies /api and /health to the backend (same-origin, no CORS needed).
#
# NOTE: this is the unauthenticated prototype. It trusts the X-Fortify-Role /
# X-Fortify-Purpose headers. Do not expose it to untrusted networks
# (see SECURITY_MODEL.md).

services:
  pipeline:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/build_all.py"]
    environment:
      # The demo workflow state must also live on the mounted volume (the
      # image's backend/ tree is read-only for the runtime user).
      FORTIFY_DATABASE_URL: sqlite:////app/data/runtime/fortify.db
    volumes:
      - fortify-data:/app/data/generated
      - fortify-runtime:/app/data/runtime
      - fortify-artifacts:/app/artifacts
    restart: "no"

  fortify-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      # Absolute path inside the mounted volume (the image tree is read-only
      # for the runtime user).
      FORTIFY_DATABASE_URL: sqlite:////app/data/runtime/fortify.db
      FORTIFY_CORS_ORIGINS: http://localhost:5173
    volumes:
      - fortify-data:/app/data/generated
      - fortify-runtime:/app/data/runtime
      - fortify-artifacts:/app/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      # Mirrors the image HEALTHCHECK; explicit here for compose.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  fortify-frontend:
    build:
      context: ./frontend
    depends_on:
      fortify-backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  fortify-data:
  fortify-runtime:
  fortify-artifacts:
