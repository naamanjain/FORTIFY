# FORTIFY CI — quality gate.
#
# The repository ships no generated data or models (they are 300+ MB of
# regenerable output), so CI proves the complete chain from a fresh clone:
# secret scan -> tracked-artifact check -> pinned install -> seed-42
# regeneration -> pytest -> phase validators -> model-validity probes.
#
# A green run here means: no secrets are committed, no regenerable output has
# been accidentally tracked, the deterministic pipeline still reproduces,
# every behavior test passes, and the model's validity probes (leakage,
# contamination) still hold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (current tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credential patterns
        run: |
          # Fail closed on anything that looks like a real credential. Test
          # fixtures must self-identify (e.g. "test", "example", "demo") to be
          # allowlisted, and each allowlist hit is printed for review.
          set -o pipefail
          PATTERN='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]+|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{20,})'
          matches=$(git grep -nI -E "$PATTERN" -- . || true)
          if [ -n "$matches" ]; then
            echo "Potential secret detected:"
            echo "$matches"
            exit 1
          fi
          echo "No credential patterns in tracked files."

      - name: Fail if generated artifacts become tracked
        run: |
          # These are produced by scripts/build_all.py and are never committed.
          tracked=$(git ls-files -- 'data/generated/*.csv' 'artifacts/**' 'frontend/dist/**' || true)
          if [ -n "$tracked" ]; then
            echo "Regenerable files are tracked; the repository must ship source only:"
            echo "$tracked"
            exit 1
          fi
          echo "No regenerable artifacts tracked."

  frontend-build:
    name: Frontend typecheck + build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (includes TypeScript check)
        working-directory: frontend
        run: npm run build

  backend-verify:
    name: Backend tests + validators + validity probes (Python 3.13, seed 42)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r backend/requirements.txt

      - name: Regenerate the deterministic demo environment
        # Dashboard/workflow integration tests read these artifacts, so the
        # data must exist before pytest runs (same as a fresh local clone).
        run: python scripts/build_all.py

      - name: Run backend test suite
        run: pytest -q

      - name: Phase validators
        run: |
          python scripts/validate_synthetic_data.py --output data/generated --personnel 500 --days 180
          python scripts/validate_features.py --input data/generated/person_day_features.csv --personnel 500 --days 180
          python scripts/validate_baselines.py --input data/generated/person_day_features_baseline.csv
          python scripts/validate_model.py
          python scripts/validate_phase5_risk_layer.py
          python scripts/validate_interventions.py --input data/generated/intervention_recommendations.csv --report data/generated/intervention_generation_report.json
          python scripts/validate_feasibility.py --expected-rows 90000
          python scripts/validate_security.py
          python scripts/validate_workflow.py
          python scripts/validate_dashboard.py
          python scripts/validate_demo.py
          python scripts/validate_hardening.py
          python scripts/validate_product_experience.py
          python scripts/validate_stitch_product.py

      - name: Model validity probes (leakage, contamination, baselines)
        # Fails the build if features ever start depending on future data or on
        # the label, or if the temporal partitions overlap.
        run: python scripts/validate_model_validity.py

      - name: Alert policy + explanation fidelity + fatigue simulation
        # Non-negotiable operational gates: the alert policy must bound case
        # creation (regression to "a case per threshold day" fails here),
        # every displayed explanation must trace to real computed data, and
        # recommendation provenance must name real policy rules.
        run: |
          python scripts/simulate_alert_fatigue.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path("artifacts/benchmark/alert_fatigue.json").read_text())
          population_days = report["population"]["person_days"]
          # The policy must suppress the overwhelming majority of naive
          # threshold-day alerts; a regression to unbounded case creation
          # (e.g. one case per person-day) fails here.
          if report["policy_new_cases"] > 1000:
              sys.exit(f"ALERT VOLUME GATE FAILED: {report['policy_new_cases']} cases created (budget regression)")
          if report["suppressed_by_budget"] and not report["duplicate_alerts_prevented"]:
              sys.exit("ALERT POLICY GATE FAILED: suppressions present but no duplicate prevention")
          print(f"Alert-volume gate OK: {report['policy_new_cases']} cases, "
                f"{report['duplicate_alerts_prevented']} duplicates prevented")
          PY

      - name: Explanation and recommendation fidelity gates
        # Included in the pytest run above via test_explanation_fidelity.py;
        # re-asserted here explicitly so the gate is visible in the job log.
        run: pytest backend/tests/test_explanation_fidelity.py backend/tests/test_alert_policy.py -q

      - name: Upload regenerated artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-artifacts
          path: |
            data/generated/*_report.json
            artifacts/model_validity/
          retention-days: 7
          if-no-files-found: error
