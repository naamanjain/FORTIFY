# FORTIFY CI — quality gate.
#
# The repository ships no generated data or models (they are 300+ MB of
# regenerable output), so CI proves the complete chain from a fresh clone:
# secret scan -> tracked-artifact check -> pinned install -> seed-42
# regeneration -> pytest -> phase validators -> model-validity probes.
#
# A green run here means: no secrets are committed, no regenerable output has
# been accidentally tracked, the deterministic pipeline still reproduces,
# every behavior test passes, and the model's validity probes (leakage,
# contamination) still hold.
name: CI

# Least privilege: this workflow builds and tests only. It never needs write
# access, and the artifact upload step uses the action's own scoped token.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (current tree + full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the history scan below has to read every
          # blob that was ever committed, including files later deleted.
          fetch-depth: 0
      - name: Scan tracked files for credential patterns
        run: |
          # Fail closed on anything that looks like a real credential. Test
          # fixtures must self-identify (e.g. "test", "example", "demo") to be
          # allowlisted, and each allowlist hit is printed for review.
          set -o pipefail
          PATTERN='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]+|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{20,})'
          matches=$(git grep -nI -E "$PATTERN" -- . || true)
          if [ -n "$matches" ]; then
            echo "Potential secret detected:"
            echo "$matches"
            exit 1
          fi
          echo "No credential patterns in tracked files."

      - name: Scan every commit in history (Gitleaks)
        run: |
          # The step above only sees the working tree. This one reads the diff of
          # every reachable commit, so a credential that was committed and later
          # deleted still fails the build. --max-target-megabytes=0 stops large
          # historical blobs being silently skipped, and the GIT_CONFIG_* vars
          # let git read the runner-owned checkout without writing any file.
          # The gate also proves its own coverage: a checkout that is shallow, or
          # a scan that inspects no commits, is a broken gate rather than a clean
          # repository, so both fail here instead of passing silently.
          set -o pipefail
          COMMITS=$(git rev-list --all --count)
          echo "Commits reachable from fetched refs: $COMMITS"
          if [ "$COMMITS" -lt 2 ]; then
            echo "History scan cannot be trusted: the checkout holds $COMMITS commit(s)."
            exit 1
          fi
          OUT="$RUNNER_TEMP/gitleaks"; mkdir -p "$OUT"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -v "$OUT:/out" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 --no-banner git \
              --redact --max-target-megabytes=0 --log-opts="--all" \
              --report-format=json --report-path=/out/report.json /repo \
              >"$OUT/stdout.log" 2>"$OUT/stderr.log"
          rc=$?
          cat "$OUT/stderr.log" "$OUT/stdout.log"
          if [ "$rc" -ne 0 ]; then
            echo "Gitleaks found credential material in Git history (exit $rc)."
            python3 -c "import json;[print('  leak:',f.get('ruleId'),f.get('file'),f.get('commit')) for f in json.load(open('$OUT/report.json'))]"
            exit "$rc"
          fi
          # A scanner that reads nothing exits 0 and says "no leaks found" - that
          # is not a clean repository. Three independent proofs are required:
          # the checkout holds full history (>=2 commits, so fetch-depth can never
          # be relaxed into a vacuous pass), Gitleaks actually walked commits, and
          # its log contains no errors (an unreadable mount shows up here).
          scanned=$(grep -oE '[0-9]+ commits scanned' "$OUT/stderr.log" | grep -oE '^[0-9]+' | head -1)
          if [ -z "$scanned" ] || [ "$scanned" -lt 1 ]; then
            echo "History scan gate is broken: Gitleaks scanned no commits ($scanned)."
            exit 1
          fi
          if grep -qE '\bERR\b' "$OUT/stderr.log"; then
            echo "History scan logged errors; refusing to call it clean."
            exit 1
          fi
          # Gitleaks writes no report file when it finds nothing, so absence is
          # only clean when the scan itself exited 0.
          FINDINGS=0
          if [ -f "$OUT/report.json" ]; then
            FINDINGS=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$OUT/report.json")
          fi
          if [ "$FINDINGS" != "0" ]; then
            echo "Gitleaks reported $FINDINGS finding(s) but exited 0; refusing to pass."
            exit 1
          fi
          echo "History scan clean: 0 findings across $scanned/$COMMITS commits."

      - name: Fail if generated artifacts become tracked
        run: |
          # These are produced by scripts/build_all.py and are never committed.
          tracked=$(git ls-files -- 'data/generated/*.csv' 'artifacts/**' 'frontend/dist/**' || true)
          if [ -n "$tracked" ]; then
            echo "Regenerable files are tracked; the repository must ship source only:"
            echo "$tracked"
            exit 1
          fi
          echo "No regenerable artifacts tracked."

  docker-build:
    name: Docker build (both images, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t fortify-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t fortify-frontend:ci frontend/
      - name: Verify images are clean
        run: |
          # No datasets, no node_modules, non-root runtime.
          docker run --rm --entrypoint sh fortify-backend:ci             -c 'id -u | grep -qx 10001 && ! ls /app/data/generated/*.csv >/dev/null 2>&1 && echo backend-clean'
          docker run --rm --entrypoint sh fortify-frontend:ci             -c '! test -d /app/node_modules && echo frontend-clean'

  frontend-build:
    name: Frontend typecheck + build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (includes TypeScript check)
        working-directory: frontend
        run: npm run build

  backend-verify:
    name: Backend tests + validators + validity probes (Python 3.13, seed 42)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r backend/requirements.txt

      - name: Regenerate the deterministic demo environment
        # Dashboard/workflow integration tests read these artifacts, so the
        # data must exist before pytest runs (same as a fresh local clone).
        run: python scripts/build_all.py

      - name: Run backend test suite
        run: pytest -q

      - name: Phase validators
        run: |
          python scripts/validate_synthetic_data.py --output data/generated --personnel 500 --days 180
          python scripts/validate_features.py --input data/generated/person_day_features.csv --personnel 500 --days 180
          python scripts/validate_baselines.py --input data/generated/person_day_features_baseline.csv
          python scripts/validate_model.py
          python scripts/validate_phase5_risk_layer.py
          python scripts/validate_interventions.py --input data/generated/intervention_recommendations.csv --report data/generated/intervention_generation_report.json
          python scripts/validate_feasibility.py --expected-rows 90000
          python scripts/validate_security.py
          python scripts/validate_workflow.py
          python scripts/validate_dashboard.py
          python scripts/validate_demo.py
          python scripts/validate_hardening.py
          python scripts/validate_product_experience.py
          python scripts/validate_stitch_product.py

      - name: Model validity probes (leakage, contamination, baselines)
        # Fails the build if features ever start depending on future data or on
        # the label, or if the temporal partitions overlap.
        run: python scripts/validate_model_validity.py

      - name: Alert policy + explanation fidelity + fatigue simulation
        # Non-negotiable operational gates: the alert policy must bound case
        # creation (regression to "a case per threshold day" fails here),
        # every displayed explanation must trace to real computed data, and
        # recommendation provenance must name real policy rules.
        run: |
          python scripts/simulate_alert_fatigue.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path("artifacts/benchmark/alert_fatigue.json").read_text())
          population_days = report["population"]["person_days"]
          # The policy must suppress the overwhelming majority of naive
          # threshold-day alerts; a regression to unbounded case creation
          # (e.g. one case per person-day) fails here.
          if report["policy_new_cases"] > 1000:
              sys.exit(f"ALERT VOLUME GATE FAILED: {report['policy_new_cases']} cases created (budget regression)")
          if report["suppressed_by_budget"] and not report["duplicate_alerts_prevented"]:
              sys.exit("ALERT POLICY GATE FAILED: suppressions present but no duplicate prevention")
          print(f"Alert-volume gate OK: {report['policy_new_cases']} cases, "
                f"{report['duplicate_alerts_prevented']} duplicates prevented")
          PY

      - name: Explanation and recommendation fidelity gates
        # Included in the pytest run above via test_explanation_fidelity.py;
        # re-asserted here explicitly so the gate is visible in the job log.
        run: pytest backend/tests/test_explanation_fidelity.py backend/tests/test_alert_policy.py -q

      - name: Red-team and privacy-surface gates
        # The red-team campaign and per-role privacy surfaces must hold; the
        # red-team evidence report is published with the run.
        run: |
          pytest backend/tests/test_red_team.py backend/tests/test_privacy_surface.py backend/tests/test_oidc.py backend/tests/test_auth_modes.py -q --red-team-report
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/red_team/red_team_report.json").read_text())
          if report["failed"]:
              raise SystemExit(f"RED-TEAM GATE FAILED: {report['failed']} attacks breached")
          # Skipped attacks are coverage gaps, not breaches, but they must be
          # visible: an attack that never ran proved nothing.
          print(f"Red-team gate OK: {report['passed']}/{report['total']} attacks held, "
                f"{report.get('not_executed', 0)} NOT EXECUTED (data-dependent skips)")
          PY

      - name: Upload regenerated artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-artifacts
          path: |
            data/generated/*_report.json
            artifacts/model_validity/
          retention-days: 7
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL 16 integration (disposable service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fortify
          POSTGRES_PASSWORD: fortify_ci_only
          POSTGRES_DB: fortify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fortify -d fortify_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt

      - name: Install pinned dependencies (base + PostgreSQL extras)
        run: pip install -r backend/requirements.txt -r backend/requirements-postgres.txt

      - name: Live schema, transition and row-lock checks
        # The database is created by the service container for this job only and
        # is destroyed with the runner. The test drops/recreates the public
        # schema, so it must never point at a shared server.
        env:
          FORTIFY_TEST_POSTGRES_URL: postgresql://fortify:fortify_ci_only@localhost:5432/fortify_ci
          FORTIFY_DATABASE_URL: postgresql://fortify:fortify_ci_only@localhost:5432/fortify_ci
        run: pytest backend/tests/test_postgres_live.py -q
